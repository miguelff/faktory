<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0c10" />
<title>Faktory — orchestration board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c10; --panel: #14161c; --line: #23262f;
    --text: #e8eaf0; --muted: #8b90a0; --accent: #ffb454;
    --ok: #7ee787; --warn: #f0883e; --err: #ff7b72; --info: #79c0ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .skip-link {
    position: absolute; left: -9999px; top: 0; background: var(--accent);
    color: #000; padding: .5rem 1rem; z-index: 10;
  }
  .skip-link:focus-visible { left: 0; }
  header {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0;
  }
  h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  h1 .mark { color: var(--accent); }
  .prefix { color: var(--muted); font-family: ui-monospace, monospace; font-size: .85rem; }
  .spacer { flex: 1; }
  main { padding: 1.25rem 1.5rem; max-width: 72rem; margin: 0 auto; }
  button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: .35rem .8rem; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, a:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary { background: var(--accent); color: #14161c; border-color: var(--accent); font-weight: 600; }
  button[disabled] { opacity: .5; cursor: default; }
  nav.filters { display: flex; gap: .4rem; flex-wrap: wrap; margin: 0 0 1rem; }
  nav.filters a {
    color: var(--muted); text-decoration: none; border: 1px solid var(--line);
    border-radius: 999px; padding: .2rem .75rem; font-size: .82rem;
  }
  nav.filters a[aria-current="true"] { color: var(--text); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: .8rem; }
  td, th { padding: .5rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
  td.title-cell { max-width: 28rem; }
  td.title-cell a { color: var(--text); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.title-cell a:hover { color: var(--accent); text-decoration: underline; }
  .badge {
    display: inline-block; font-family: ui-monospace, monospace; font-size: .78rem;
    border: 1px solid var(--line); border-radius: 4px; padding: .1rem .5rem; white-space: nowrap;
  }
  .badge[data-phase="discovered"]      { color: var(--muted); }
  .badge[data-phase="queued"]          { color: var(--info);  border-color: var(--info); }
  .badge[data-phase="dispatching"],
  .badge[data-phase="running"],
  .badge[data-phase="deploying"]       { color: var(--accent); border-color: var(--accent); }
  .badge[data-phase="reviewing"]       { color: var(--info);  border-color: var(--info); }
  .badge[data-phase="blocked"],
  .badge[data-phase="failed"]          { color: var(--err);   border-color: var(--err); }
  .badge[data-phase="ready_to_deploy"],
  .badge[data-phase="done"]            { color: var(--ok);    border-color: var(--ok); }
  .empty {
    border: 1px dashed var(--line); border-radius: 8px; padding: 2.5rem 1rem;
    text-align: center; color: var(--muted);
  }
  .agent { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--muted); }
  #status { color: var(--muted); font-size: .82rem; min-height: 1.2em; }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: border-color .12s ease, opacity .12s ease; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#board-heading">Skip to board</a>
<header>
  <h1><span class="mark" aria-hidden="true">⚙</span> Faktory <span class="prefix" id="prefix"></span></h1>
  <div class="spacer"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <button class="primary" id="sync-btn" type="button">Sync candidates</button>
</header>
<main>
  <h2 id="board-heading" style="position:absolute;left:-9999px">Task board</h2>
  <nav class="filters" aria-label="Filter by phase" id="filters"></nav>
  <div id="board"></div>
</main>
<script>
const PHASES = ["discovered","queued","dispatching","running","reviewing","blocked","ready_to_deploy","deploying","done","failed","cancelled"];
const statusEl = document.getElementById("status");
const params = () => new URLSearchParams(location.search);

function say(msg) { statusEl.textContent = msg; }

function renderFilters() {
  const current = params().get("phase") ?? "";
  const nav = document.getElementById("filters");
  const link = (label, value) =>
    `<a href="?${value ? "phase=" + value : ""}" aria-current="${current === value}">${label}</a>`;
  nav.innerHTML = [link("all", ""), ...PHASES.map((p) => link(p.replaceAll("_", " "), p))].join("");
}

function actionButtons(t) {
  const btn = (label, fn, primary = false) =>
    `<button type="button" ${primary ? 'class="primary"' : ""} data-action="${fn}" data-id="${t.id}">${label}</button>`;
  if (t.phase === "discovered") return btn("Queue", "queue");
  if (t.phase === "queued") return btn("Dispatch", "dispatch", true);
  if (t.phase === "blocked") return btn("Resume", "resume");
  if (t.phase === "failed") return btn("Retry", "retry");
  return "";
}

async function load() {
  renderFilters();
  const health = await (await fetch("/api/health")).json();
  document.getElementById("prefix").textContent = health.prefix;
  document.title = `Faktory — ${health.prefix}`;
  const phase = params().get("phase");
  const res = await fetch("/api/tasks" + (phase ? `?phase=${encodeURIComponent(phase)}` : ""));
  const { tasks } = await res.json();
  const board = document.getElementById("board");
  if (!tasks.length) {
    board.innerHTML = `<div class="empty"><p>No tasks${phase ? ` in “${phase.replaceAll("_"," ")}”` : ""} yet.</p>
      <p>Tag an issue with the candidacy tag in your source, then press “Sync candidates”.</p></div>`;
    return;
  }
  board.innerHTML = `<table>
    <thead><tr><th scope="col">#</th><th scope="col">Title</th><th scope="col">Phase</th>
    <th scope="col">Priority</th><th scope="col">Agent</th><th scope="col"><span style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
    <tbody>${tasks.map((t) => `<tr>
      <td class="num">${t.id}</td>
      <td class="title-cell"><a href="${t.url}" target="_blank" rel="noopener" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</a></td>
      <td><span class="badge" data-phase="${t.phase}">${t.phase.replaceAll("_", " ")}</span></td>
      <td class="num">${t.priority ?? "—"}</td>
      <td class="agent">${t.agentName ?? ""}</td>
      <td>${actionButtons(t)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error ?? res.statusText);
  return data;
}

document.getElementById("sync-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true; say("Syncing…");
  try {
    const { discovered } = await post("/api/sync");
    say(discovered.length ? `Discovered ${discovered.length} new task(s)` : "Up to date");
  } catch (err) { say(`Sync failed: ${err.message}`); }
  btn.disabled = false;
  load();
});

document.getElementById("board").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  btn.disabled = true;
  try {
    switch (btn.dataset.action) {
      case "queue": say("Queuing…"); await post(`/api/tasks/${id}/transition`, { to: "queued", actor: "web" }); say("Queued"); break;
      case "dispatch":
        if (!confirm("Dispatch this task to an agent in herdr?")) break;
        say("Dispatching…"); await post(`/api/tasks/${id}/dispatch`); say("Agent started"); break;
      case "resume": say("Resuming…"); await post(`/api/tasks/${id}/transition`, { to: "running", actor: "web" }); say("Resumed"); break;
      case "retry": say("Retrying…"); await post(`/api/tasks/${id}/transition`, { to: "queued", actor: "web" }); say("Requeued"); break;
    }
  } catch (err) { say(`Action failed: ${err.message}`); }
  load();
});

load();
setInterval(load, 5000);
</script>
</body>
</html>
